<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

    <title>Pac-Man</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">

    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
       html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #game-container {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: black;
        }

        #screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            touch-action: none;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qt-shadow-container {
            width: 100% !important;
            height: 100% !important;
        }

        #qtspinner {
            color: white;
        }

        #qtspinner strong,
        #qtstatus,
        #qtspinner noscript {
            color: white;
        }

        #qtstatus {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        /*
         * Mobile controls
         * Hidden by default on desktop.
         */
        #mobile-controls {
            display: none;

            width: 100%;
            height: 25vh;
            --control-size: clamp(64px, min(18vw, 10vh), 110px);

            flex-shrink: 0;

            justify-content: center;
            align-items: center;

            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .direction-button {
            display: none;
        }

        #dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #dpad-row {
            display: flex;
            gap: 8px;
        }

        .control-button {
            width: var(--control-size);
            height: var(--control-size);

            border: 2px solid white;
            border-radius: 12px;

            background: #111;
            color: white;

            font-size: clamp(24px, 7vw, 40px);
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-button:active {
            background: #333;
            transform: scale(0.95);
        }

        .control-button.direction-button {
            display: none;
        }

        #start-button {
            width: calc(var(--control-size) * 2.5);
        }

        /*
         * Mobile layout
         */
        @media (pointer: coarse) {
            #screen {
                height: 75vh;
                flex: none;
            }

            #mobile-controls {
                display: flex;
            }
        }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: Pac-Man</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="game-container">
        <div id="screen"></div>

                <!-- Mobile controls -->
        <div id="mobile-controls" style="display: none;">
            <div id="dpad">

                <!-- START -->
                <button
                    id="start-button"
                    class="control-button"
                >
                    START
                </button>

                <!-- Direction buttons -->
                <div id="dpad-row">
                    <button
                        class="control-button direction-button"
                        data-key="ArrowLeft"
                    >
                        ◀
                    </button>

                    <button
                        class="control-button direction-button"
                        data-key="ArrowDown"
                    >
                        ▼
                    </button>

                    <button
                        class="control-button direction-button"
                        data-key="ArrowRight"
                    >
                        ▶
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function sendKey(key, wasmInstance) {
            const keyMap = {
                ArrowUp: 16777235,
                ArrowDown: 16777237,
                ArrowLeft: 16777234,
                ArrowRight: 16777236
            };

            const qtKey = keyMap[key];

            if (qtKey === undefined)
                return;

            if (wasmInstance && typeof wasmInstance._handleWebKey === "function") {
                wasmInstance._handleWebKey(qtKey);
                return true;
            }

            console.error("handleWebKey is not available in the WebAssembly module");
            return false;
        }

        function startGameFromWeb(wasmInstance) {
            if (wasmInstance && wasmInstance._startGameFromWeb) {
                wasmInstance._startGameFromWeb();
                return true;
            }

            console.error("startGameFromWeb is not available in the WebAssembly module");
            return false;
        }

        /*
        * Mobile controls
        */
        function setupMobileControls(wasmInstance) {
            const buttons = document.querySelectorAll(".control-button[data-key]");

            buttons.forEach(button => {
                button.addEventListener("click", function(event) {
                    event.preventDefault();
                    sendKey(button.dataset.key, wasmInstance);
                });
            });
        }

        function setupSwipeControls(screen, wasmInstance) {
            let startX = 0;
            let startY = 0;
            let swipeActive = false;
            const swipeThreshold = 30;

            screen.addEventListener("pointerdown", function(event) {
                if (event.pointerType !== "touch")
                    return;

                startX = event.clientX;
                startY = event.clientY;
                swipeActive = true;
                event.preventDefault();
            });

            screen.addEventListener("pointerup", function(event) {
                if (!swipeActive || event.pointerType !== "touch")
                    return;

                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                const distance = Math.max(Math.abs(deltaX), Math.abs(deltaY));

                swipeActive = false;
                event.preventDefault();

                if (distance < swipeThreshold)
                    return;

                if (Math.abs(deltaX) > Math.abs(deltaY))
                    sendKey(deltaX > 0 ? "ArrowRight" : "ArrowLeft", wasmInstance);
                else
                    sendKey(deltaY > 0 ? "ArrowDown" : "ArrowUp", wasmInstance);
            });

            screen.addEventListener("pointercancel", function() {
                swipeActive = false;
            });
        }

        function setupStartButton(wasmInstance) {
            const startButton = document.getElementById("start-button");

            startButton.addEventListener("click", function(event) {
                event.preventDefault();

                if (!startGameFromWeb(wasmInstance))
                    return;

                // Zmieniamy START na strzałkę
                startButton.textContent = "▲";
                startButton.id = "up-button";

                // Pokazujemy pozostałe kierunki
                document
                    .querySelectorAll(".direction-button")
                    .forEach(button => {
                        button.style.display = "flex";
                    });

                // Przekształcamy START w przycisk góra
                startButton.dataset.key = "ArrowUp";

                startButton.addEventListener("click", function(event) {
                    event.preventDefault();
                    sendKey("ArrowUp", wasmInstance);
                });
            }, { once: true });
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');
            const mobileControls = document.querySelector('#mobile-controls');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () =>  {
                            showUi(screen);
                            if (window.matchMedia('(pointer: coarse)').matches)
                                mobileControls.style.display = 'flex';
                        },
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.Pac_Man_entry,
                        containerElements: [screen],
                        
                    }
                });

                setupMobileControls(instance);
                setupSwipeControls(screen, instance);
                setupStartButton(instance);
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="Pac-Man.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
