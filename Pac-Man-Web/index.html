<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

    <title>Pac-Man</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
       html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #game-container {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: black;
        }

        #screen {
            width: 100%;
            height: 100%;
            min-height: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qt-shadow-container {
            width: 100% !important;
            height: 100% !important;
        }

        /*
         * Mobile controls
         * Hidden by default on desktop.
         */
        #mobile-controls {
            display: none;

            width: 100%;
            height: 25vh;

            flex-shrink: 0;

            justify-content: center;
            align-items: center;

            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #dpad-row {
            display: flex;
            gap: 8px;
        }

        .control-button {
            width: 64px;
            height: 64px;

            border: 2px solid white;
            border-radius: 12px;

            background: #111;
            color: white;

            font-size: 28px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-button:active {
            background: #333;
            transform: scale(0.95);
        }

        /*
         * Mobile layout
         */
        @media (pointer: coarse) {
            #screen {
                height: 75vh;
                flex: none;
            }

            #mobile-controls {
                display: flex;
            }
        }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: Pac-Man</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="game-container">
        <div id="screen"></div>

                <!-- Mobile controls -->
        <div id="mobile-controls">
            <div id="dpad">
                <button
                    class="control-button"
                    data-key="ArrowUp"
                >
                    ▲
                </button>
                <div id="dpad-row">
                    <button
                        class="control-button"
                        data-key="ArrowLeft"
                    >
                        ◀
                    </button>
                    <button
                        class="control-button"
                        data-key="ArrowDown"
                    >
                        ▼
                    </button>
                    <button
                        class="control-button"
                        data-key="ArrowRight"
                    >
                        ▶
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function sendKey(key) {
            const keyMap = {
                ArrowUp: 38,
                ArrowDown: 40,
                ArrowLeft: 37,
                ArrowRight: 39
            };

            const qtKey = keyMap[key];

            if (qtKey === undefined)
                return;

            if (typeof Module !== "undefined" && Module.ccall) {
                Module.ccall(
                    "handleWebKey",
                    null,
                    ["number"],
                    [qtKey]
                );
            }
        }

        /*
        * Mobile controls
        */
        function setupMobileControls() {
            const buttons = document.querySelectorAll(".control-button");

            buttons.forEach(button => {
                const key = button.dataset.key;

                button.addEventListener("touchstart", function(event) {
                    event.preventDefault();
                    sendKey(key);
                }, { passive: false });

                button.addEventListener("mousedown", function(event) {
                    event.preventDefault();
                    sendKey(key);
                });
            });
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () =>  {
                            showUi(screen);
                            setupMobileControls();
                        },
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.Pac_Man_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="Pac-Man.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
